<div id="app">
  <aside id="sidebar" aria-label="Conversations">
    <div class="sb-top">
      <div class="brand"><svg class="logo"><use href="#logo"/></svg><div><b>LocalMind</b><small>by Dyabi</small></div></div>
      <button class="icon-btn" id="btnCollapse" title="Close sidebar (Ctrl+B)" aria-label="Close sidebar"><svg class="i"><use href="#i-panel"/></svg></button>
    </div>
    <div class="sb-actions">
      <button class="sb-btn primary" id="btnNew"><svg class="i"><use href="#i-plus"/></svg>New chat<kbd>Ctrl+Shift+O</kbd></button>
      <button class="sb-btn" id="btnSearch"><svg class="i"><use href="#i-search"/></svg>Search chats<kbd>Ctrl+K</kbd></button>
    </div>
    <div class="sb-scroll" id="sbScroll"></div>
    <div class="sb-foot">
      <div class="status" id="status" role="button" tabindex="0" title="Model status"><i class="dot busy" id="dot"></i><span id="statusTxt">Starting…</span></div>
      <button class="icon-btn" id="btnMem" title="Memory" aria-label="Memory"><svg class="i"><use href="#i-brain"/></svg></button>
      <button class="icon-btn" id="btnSettings" title="Settings (Ctrl+,)" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button class="icon-btn" id="btnOpen" title="Open sidebar (Ctrl+B)" aria-label="Open sidebar" style="display:none"><svg class="i"><use href="#i-panel"/></svg></button>
      <button class="pill-btn" id="btnAssistant" title="Choose an assistant"><span id="asstName">LocalMind</span><small id="asstSub">Phi Silica · on-device</small><svg class="i" style="width:15px;height:15px"><use href="#i-chev"/></svg></button>
      <div id="chatTitle"></div>
      <span class="badge temp" id="tempBadge" style="display:none"><svg class="i" style="width:14px;height:14px"><use href="#i-lock"/></svg>Temporary</span>
      <button class="icon-btn" id="btnCtx" title="Context"><svg class="ring" viewBox="0 0 24 24"><circle class="bg" cx="12" cy="12" r="9"/><circle class="fg" id="ringFg" cx="12" cy="12" r="9" transform="rotate(-90 12 12)" stroke-dasharray="56.5" stroke-dashoffset="56.5"/></svg></button>
      <button class="icon-btn" id="btnTemp" title="Temporary chat (not saved, no memory)" aria-label="Temporary chat"><svg class="i"><use href="#i-lock"/></svg></button>
      <button class="icon-btn" id="btnTheme" title="Switch theme" aria-label="Switch theme"><svg class="i"><use href="#i-moon"/></svg></button>
      <button class="icon-btn" id="btnChatMenu" title="Chat options" aria-label="Chat options"><svg class="i"><use href="#i-dots"/></svg></button>
    </header>

    <section id="stream" aria-live="polite"><div id="thread"></div></section>
    <button class="jump" id="jump"><svg class="i" style="width:15px;height:15px"><use href="#i-chev"/></svg>Jump to latest</button>

    <div id="composerWrap">
      <div id="composer">
        <div id="slash" style="display:none"></div>
        <div id="attachRow"></div>
        <textarea id="input" rows="1" placeholder="Message LocalMind…  (type / for commands)" aria-label="Message"></textarea>
        <div class="cbar">
          <button class="icon-btn" id="btnAttach" title="Attach files or images" aria-label="Attach files"><svg class="i"><use href="#i-clip"/></svg></button>
          <button class="icon-btn" id="btnImage" title="Create a picture (/image)" aria-label="Create a picture"><svg class="i"><use href="#i-image"/></svg></button>
          <button class="icon-btn" id="btnKnow" title="Files this chat can use" aria-label="Files this chat can use"><svg class="i"><use href="#i-book"/></svg></button>
          <span class="chip" id="scopeChip" style="display:none"></span>
          <span class="sp"></span>
          <button class="send" id="btnSend" title="Send (Enter)" aria-label="Send" disabled><svg class="i"><use href="#i-send"/></svg></button>
        </div>
      </div>
      <div class="hint" id="hint"><span><b>Runs on this PC.</b> On-device Phi Silica — nothing is sent to the cloud.</span><span id="hintMem"></span></div>
    </div>
  </main>
</div>

<div id="overlay" role="dialog" aria-modal="true"></div>
<div class="dropveil" id="dropveil"><div>Drop files to add them to this chat<small>Documents, PDFs, spreadsheets, slides, notes, code and images</small></div></div>
<div id="toast" role="status"></div>

<script src="js/chat.js"></script>
<script src="js/panels.js"></script>
<script src="js/skills-ui.js"></script>
<script src="js/main.js"></script>
